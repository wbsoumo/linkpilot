<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="dashboard/assets/img/logo.png">
    
    <title>Coming Soon - LinkPilot AI</title>
    <meta name="description" content="We are launching new features soon. Subscribe to get updates.">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="assets/css/marketing.css">
</head>
<body class="h-full bg-slate-950 text-slate-100 flex flex-col justify-between antialiased">

    <!-- Navigation -->
    <nav class="glass-nav w-full px-6 py-4 flex items-center justify-between">
        <a href="index.html" class="flex items-center space-x-2 text-xl font-bold tracking-wider">
            <span class="text-teal-400">✨ LinkPilot</span>
            <span class="text-xs px-2 py-0.5 bg-slate-800 text-teal-400 border border-slate-700 rounded-full font-semibold">AI</span>
        </a>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center p-6 text-center glow-purple">
        <div class="space-y-6 max-w-md glass-panel p-8 rounded-2xl border-slate-800 shadow-2xl">
            <span class="inline-flex items-center space-x-1 px-2.5 py-0.5 bg-purple-500/10 text-purple-400 border border-purple-500/20 rounded-full text-[10px] font-bold uppercase tracking-wider">
                <i data-lucide="cog" class="h-3.5 w-3.5 animate-spin"></i>
                <span>Under Construction</span>
            </span>
            <h1 class="text-2xl font-extrabold text-white">Launching New Features</h1>
            <p class="text-xs text-slate-400 leading-relaxed">
                We are building premium outreach integrations, Outlook setups support, and HubSpot sync hooks. Enter your email to be notified on launch.
            </p>
            <form action="thank-you.html" class="flex space-x-2">
                <input type="email" required class="flex-grow px-3 py-2 bg-slate-900 border border-slate-800 rounded-lg text-white placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-teal-500 text-xs" placeholder="e.g. you@example.com">
                <button type="submit" class="px-4 py-2 bg-teal-400 hover:bg-teal-300 text-slate-950 font-bold rounded-lg text-xs transition shadow shadow-teal-500/25">Notify Me</button>
            </form>
            <div class="border-t border-slate-850 pt-4 text-center">
                <a href="index.html" class="text-xs text-slate-500 hover:text-white transition">← Return to Home</a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-900 bg-slate-950 py-8 text-slate-500 text-xs text-center">
        <div>© 2026 LinkPilot AI. All rights reserved.</div>
    </footer>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
