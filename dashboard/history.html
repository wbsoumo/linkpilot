<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History - LinkPilot AI</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Custom Style Sheet -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="h-full bg-slate-950 text-slate-100 flex flex-col">
    <!-- Top Navigation -->
    <nav class="glass-panel rounded-none border-t-0 border-x-0 sticky top-0 z-40 bg-slate-900/80 text-white px-6 py-4 flex items-center justify-between">
        <div class="flex items-center space-x-8">
            <a href="index.html" class="flex items-center space-x-2 text-xl font-bold tracking-wider">
                <span class="text-teal-400">✨ LinkPilot</span> <span class="text-xs px-2 py-0.5 bg-slate-800 text-teal-400 border border-slate-700 rounded-full font-semibold">AI</span>
            </a>
            <div class="hidden md:flex items-center space-x-1">
                <a href="index.html" class="sidebar-nav-link px-4 py-2 rounded-lg text-sm font-semibold transition duration-150">Dashboard</a>
                <a href="history.html" class="sidebar-nav-link px-4 py-2 rounded-lg text-sm font-semibold transition duration-150">History</a>
                <a href="smtp.html" class="sidebar-nav-link px-4 py-2 rounded-lg text-sm font-semibold transition duration-150">SMTP & AI Settings</a>
                <a href="profile.html" class="sidebar-nav-link px-4 py-2 rounded-lg text-sm font-semibold transition duration-150">Profile</a>
                <a href="admin.html" id="admin-nav-link" class="sidebar-nav-link px-4 py-2 rounded-lg text-sm font-semibold transition duration-150 hidden">Admin</a>
            </div>
        </div>
        <div class="flex items-center space-x-4">
            <div class="text-right hidden sm:block">
                <div class="text-sm font-semibold user-name-display">Loading...</div>
                <div class="text-xs text-slate-400 user-email-display">...</div>
            </div>
            <div class="h-9 w-9 rounded-full bg-teal-500 text-slate-950 font-bold flex items-center justify-center border border-teal-400" id="user-avatar-initials">
                LP
            </div>
            <button id="logout-action-btn" class="p-2 text-slate-400 hover:text-red-400 rounded-lg hover:bg-slate-800/50 transition">
                <i data-lucide="log-out" class="h-5 w-5"></i>
            </button>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="flex-grow p-6 md:p-8 space-y-6 max-w-7xl w-full mx-auto animate-fade-in">
        <div>
            <h1 class="text-2xl font-extrabold text-white">Outreach History</h1>
            <p class="text-slate-400 text-sm mt-1">Review, search, and manage all your past AI generations and emails.</p>
        </div>

        <!-- History Tabs -->
        <div class="border-b border-slate-800 flex space-x-6">
            <button onclick="switchTab('all')" id="tab-all" class="history-tab border-b-2 border-teal-400 pb-3 text-teal-400 font-semibold text-sm">All Activities</button>
            <button onclick="switchTab('emails')" id="tab-emails" class="history-tab border-b-2 border-transparent pb-3 text-slate-400 hover:text-white font-semibold text-sm">Emails</button>
            <button onclick="switchTab('whatsapp')" id="tab-whatsapp" class="history-tab border-b-2 border-transparent pb-3 text-slate-400 hover:text-white font-semibold text-sm">WhatsApp</button>
            <button onclick="switchTab('comments')" id="tab-comments" class="history-tab border-b-2 border-transparent pb-3 text-slate-400 hover:text-white font-semibold text-sm">Comments</button>
        </div>

        <!-- Filters Section -->
        <div class="glass-panel p-4 bg-slate-900/40 border-slate-800 grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
            <!-- Keyword Search -->
            <div class="relative">
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Search Content</label>
                <div class="relative">
                    <input type="text" id="filter-search" oninput="triggerFilters()" class="w-full pl-10 pr-3 py-2 bg-slate-800/80 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-teal-500 text-sm" placeholder="Search keywords...">
                    <i data-lucide="search" class="absolute left-3 top-2.5 h-4 w-4 text-slate-500"></i>
                </div>
            </div>

            <!-- Start Date -->
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Start Date</label>
                <input type="date" id="filter-start-date" onchange="triggerFilters()" class="w-full px-3 py-2 bg-slate-800/80 border border-slate-700 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-teal-500 text-sm">
            </div>

            <!-- End Date -->
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">End Date</label>
                <input type="date" id="filter-end-date" onchange="triggerFilters()" class="w-full px-3 py-2 bg-slate-800/80 border border-slate-700 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-teal-500 text-sm">
            </div>

            <!-- Reset Filters -->
            <div>
                <button onclick="resetFilters()" class="w-full py-2 border border-slate-700 hover:border-slate-500 rounded-lg text-sm hover:text-white font-semibold transition">
                    Reset Filters
                </button>
            </div>
        </div>

        <!-- History Content -->
        <div class="glass-panel bg-slate-900/40 border-slate-800 overflow-x-auto">
            <table class="w-full text-left border-collapse custom-table">
                <thead>
                    <tr class="border-b border-slate-800">
                        <th class="py-4 px-6">Date</th>
                        <th class="py-4 px-6">Type</th>
                        <th class="py-4 px-6">Details</th>
                        <th class="py-4 px-6">Tokens</th>
                        <th class="py-4 px-6">Status</th>
                    </tr>
                </thead>
                <tbody id="history-table-body" class="divide-y divide-slate-800/50">
                    <tr>
                        <td colspan="5" class="py-12 text-center text-slate-500 text-sm">Loading history data...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div class="flex items-center justify-between mt-4">
            <span class="text-xs text-slate-400" id="pagination-info">Showing 0 of 0 logs</span>
            <div class="flex space-x-2">
                <button id="prev-page-btn" onclick="changePage(-1)" class="px-3 py-1.5 border border-slate-700 hover:border-slate-500 rounded-md text-xs font-semibold hover:text-white transition disabled:opacity-50 disabled:cursor-not-allowed">Previous</button>
                <button id="next-page-btn" onclick="changePage(1)" class="px-3 py-1.5 border border-slate-700 hover:border-slate-500 rounded-md text-xs font-semibold hover:text-white transition disabled:opacity-50 disabled:cursor-not-allowed">Next</button>
            </div>
        </div>
    </main>

    <!-- Central JS Handler -->
    <script src="assets/js/app.js"></script>
    <script>
        let currentTab = 'all';
        let currentPage = 1;
        let totalPages = 1;
        let searchTimeout = null;

        async function fetchHistory() {
            const search = document.getElementById('filter-search').value;
            const startDate = document.getElementById('filter-start-date').value;
            const endDate = document.getElementById('filter-end-date').value;
            
            let endpoint = `history/index.php?tab=${currentTab}&page=${currentPage}&limit=10`;
            if (search) endpoint += `&search=${encodeURIComponent(search)}`;
            if (startDate) endpoint += `&start_date=${startDate}`;
            if (endDate) endpoint += `&end_date=${endDate}`;

            try {
                const res = await apiCall(endpoint);
                const tableBody = document.getElementById('history-table-body');
                
                if (res.history.length === 0) {
                    tableBody.innerHTML = `
                        <tr>
                            <td colspan="5" class="py-16 text-center text-slate-500 text-sm">No outreach records found matching the filters.</td>
                        </tr>
                    `;
                    document.getElementById('pagination-info').textContent = `Showing 0 of 0 logs`;
                    document.getElementById('prev-page-btn').disabled = true;
                    document.getElementById('next-page-btn').disabled = true;
                    return;
                }

                tableBody.innerHTML = res.history.map(row => {
                    const date = new Date(row.created_at).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
                    
                    // Type Badge styling
                    const typeColor = row.type === 'email' ? 'bg-purple-500/10 text-purple-400 border-purple-500/20' : row.type === 'whatsapp' ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' : 'bg-amber-500/10 text-amber-400 border-amber-500/20';
                    const typeLabel = row.type === 'email' ? 'Email' : row.type === 'whatsapp' ? 'WhatsApp' : 'Comment';
                    
                    // Status Badge styling
                    let statusColor = 'bg-slate-500/10 text-slate-400 border-slate-500/20';
                    if (['Sent', 'Opened', 'Inserted'].includes(row.status)) {
                        statusColor = 'bg-green-500/10 text-green-400 border-green-500/20';
                    } else if (row.status === 'Failed') {
                        statusColor = 'bg-red-500/10 text-red-400 border-red-500/20';
                    }

                    // Content snippet
                    let contentSnippet = '';
                    if (row.type === 'email') {
                        contentSnippet = `<strong>Subject:</strong> ${row.subject}<br><span class="text-xs text-slate-400">${row.body.replace(/<[^>]*>/g, '').substring(0, 100)}...</span>`;
                    } else {
                        contentSnippet = row.body.substring(0, 120) + (row.body.length > 120 ? '...' : '');
                    }

                    return `
                        <tr class="hover:bg-slate-900/40">
                            <td class="py-4 px-6 text-sm text-slate-400 whitespace-nowrap">${date}</td>
                            <td class="py-4 px-6 whitespace-nowrap">
                                <span class="px-2.5 py-1 text-xs font-semibold border rounded-full ${typeColor}">${typeLabel}</span>
                            </td>
                            <td class="py-4 px-6 text-sm text-slate-300 max-w-md">${contentSnippet}</td>
                            <td class="py-4 px-6 text-sm text-slate-400 whitespace-nowrap">${row.tokens_used}</td>
                            <td class="py-4 px-6 whitespace-nowrap">
                                <span class="px-2.5 py-1 text-xs font-semibold border rounded-full ${statusColor}">${row.status}</span>
                            </td>
                        </tr>
                    `;
                }).join('');

                // Pagination updates
                totalPages = res.pagination.pages;
                const startLog = (currentPage - 1) * res.pagination.limit + 1;
                const endLog = Math.min(currentPage * res.pagination.limit, res.pagination.total);
                document.getElementById('pagination-info').textContent = `Showing ${startLog}-${endLog} of ${res.pagination.total} logs`;
                
                document.getElementById('prev-page-btn').disabled = currentPage <= 1;
                document.getElementById('next-page-btn').disabled = currentPage >= totalPages;

            } catch (err) {
                showNotification('error', err.message || 'Failed to load history logs.');
            }
        }

        function switchTab(tabName) {
            currentTab = tabName;
            currentPage = 1;
            
            // Toggle active classes on tab headers
            const tabs = document.querySelectorAll('.history-tab');
            tabs.forEach(tab => {
                if (tab.id === `tab-${tabName}`) {
                    tab.classList.add('border-teal-400', 'text-teal-400');
                    tab.classList.remove('border-transparent', 'text-slate-400');
                } else {
                    tab.classList.remove('border-teal-400', 'text-teal-400');
                    tab.classList.add('border-transparent', 'text-slate-400');
                }
            });

            fetchHistory();
        }

        function triggerFilters() {
            currentPage = 1;
            // Debounce keyboard typing search
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                fetchHistory();
            }, 300);
        }

        function resetFilters() {
            document.getElementById('filter-search').value = '';
            document.getElementById('filter-start-date').value = '';
            document.getElementById('filter-end-date').value = '';
            currentPage = 1;
            fetchHistory();
        }

        function changePage(direction) {
            const targetPage = currentPage + direction;
            if (targetPage >= 1 && targetPage <= totalPages) {
                currentPage = targetPage;
                fetchHistory();
            }
        }

        // Initialize on load
        document.addEventListener('DOMContentLoaded', () => {
            fetchHistory();
            lucide.createIcons();
        });
    </script>
</body>
</html>
