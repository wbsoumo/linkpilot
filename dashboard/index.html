<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">
<head>
    <script>
        (function() {
            const token = localStorage.getItem('linkpilot_token');
            if (!token) {
                window.location.replace('login.html');
            }
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/img/logo.png">
    <title>CRM Workspace - LinkPilot AI</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Custom Style Sheet -->
    <link rel="stylesheet" href="assets/css/style.css?v=2.5">
</head>
<body class="h-full bg-[#f8fafc] text-slate-800 flex overflow-hidden">

    <!-- 1. LEFT SIDEBAR PANEL -->
    <aside class="hidden lg:flex flex-col w-64 bg-[#0a1128] border-r border-slate-800/10 shrink-0 h-full justify-between">
        <!-- Logo (Sticky Top) -->
        <div class="p-5 border-b border-slate-800/20">
            <a href="index.html" class="flex items-center space-x-2 text-lg font-extrabold tracking-wider text-white">
                <i data-lucide="send" class="h-5 w-5 text-blue-500 transform rotate-45"></i>
                <span>LinkPilot <span class="text-blue-500 font-bold">CRM</span></span>
            </a>
        </div>

        <!-- Scrollable Navigation Area -->
        <div class="flex-grow overflow-y-auto p-5 space-y-6">
            <!-- Sidebar Navigation Links -->
            <nav class="space-y-1 flex flex-col text-xs" id="sidebar-navigation-container">
                <a href="#/dashboard" class="sidebar-nav-link active text-slate-300 transition duration-150">
                    <i data-lucide="grid" class="h-4 w-4 mr-2.5"></i><span>Dashboard</span>
                </a>
                <a href="#/inbox" class="sidebar-nav-link text-slate-300 transition duration-150 flex justify-between items-center w-full">
                    <div class="flex items-center">
                        <i data-lucide="message-square" class="h-4 w-4 mr-2.5"></i><span>Conversations</span>
                    </div>
                    <span id="sidebar-conversations-unread-badge" class="bg-blue-600 text-white text-[9px] font-extrabold px-1.5 py-0.5 rounded-full hidden">0</span>
                </a>
                <a href="#/leads" class="sidebar-nav-link text-slate-300 transition duration-150">
                    <i data-lucide="user-plus" class="h-4 w-4 mr-2.5"></i><span>Leads</span>
                </a>
                <a href="#/deals" class="sidebar-nav-link text-slate-300 transition duration-150">
                    <i data-lucide="dollar-sign" class="h-4 w-4 mr-2.5"></i><span>Deals</span>
                </a>
                <a href="#/contacts" class="sidebar-nav-link text-slate-300 transition duration-150">
                    <i data-lucide="contact" class="h-4 w-4 mr-2.5"></i><span>Contacts</span>
                </a>
                <a href="#/companies" class="sidebar-nav-link text-slate-300 transition duration-150">
                    <i data-lucide="building" class="h-4 w-4 mr-2.5"></i><span>Companies</span>
                </a>
                <a href="#/tasks" class="sidebar-nav-link text-slate-300 transition duration-150 flex justify-between items-center w-full">
                    <div class="flex items-center">
                        <i data-lucide="check-square" class="h-4 w-4 mr-2.5"></i><span>Tasks</span>
                    </div>
                    <span class="bg-blue-600 text-white text-[9px] font-extrabold px-1.5 py-0.5 rounded-full">8</span>
                </a>
                <a href="#/email-intelligence" class="sidebar-nav-link text-slate-300 transition duration-150">
                    <i data-lucide="mail" class="h-4 w-4 mr-2.5"></i><span>Email Processing</span>
                </a>
                <a href="#/ai-insights" class="sidebar-nav-link text-slate-300 transition duration-150">
                    <i data-lucide="sparkles" class="h-4 w-4 mr-2.5"></i><span>AI Insights</span>
                </a>
                <a href="#/reports" class="sidebar-nav-link text-slate-300 transition duration-150">
                    <i data-lucide="bar-chart-3" class="h-4 w-4 mr-2.5"></i><span>Reports</span>
                </a>
                <a href="#/automation" class="sidebar-nav-link text-slate-300 transition duration-150">
                    <i data-lucide="workflow" class="h-4 w-4 mr-2.5"></i><span>Automations</span>
                </a>
                <a href="#/settings" class="sidebar-nav-link text-slate-300 transition duration-150">
                    <i data-lucide="share-2" class="h-4 w-4 mr-2.5"></i><span>Integrations</span>
                </a>
                <a href="#/settings" class="sidebar-nav-link text-slate-300 transition duration-150">
                    <i data-lucide="settings" class="h-4 w-4 mr-2.5"></i><span>Settings</span>
                </a>
                
                <a href="admin.html" id="admin-nav-link" class="sidebar-nav-link text-rose-400 hover:bg-slate-800 transition duration-150 hidden">
                    <i data-lucide="shield-alert" class="h-4 w-4 mr-2.5"></i><span>Admin Portal</span>
                </a>
            </nav>

            <!-- Pro Plan Card -->
            <div class="bg-slate-900/60 border border-slate-800 rounded-xl p-3.5 space-y-2.5">
                <div class="text-white text-xs font-bold">Pro Plan</div>
                <div class="text-slate-500 text-[10px]">Renews on 25 Jun, 2025</div>
                <button class="w-full flex items-center justify-center space-x-1.5 py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-[10px] font-bold transition">
                    <i data-lucide="rocket" class="h-3 w-3"></i>
                    <span>Upgrade Plan</span>
                </button>
            </div>
        </div>

        <!-- Sidebar footer profile details (Sticky Bottom) -->
        <div class="p-5 border-t border-slate-800/80 space-y-4 bg-[#0a1128]">
            <!-- Profile Details -->
            <div class="flex items-center space-x-3">
                <div class="h-9 w-9 rounded-lg bg-blue-600 text-white font-bold flex items-center justify-center border border-blue-400/30" id="user-avatar-initials">
                    LP
                </div>
                <div class="truncate max-w-[140px]">
                    <div class="text-xs font-bold text-white user-name-display">User Name</div>
                    <div class="text-[10px] text-slate-500 truncate user-email-display">you@email.com</div>
                </div>
            </div>
            <button id="logout-action-btn" class="w-full flex items-center justify-center space-x-2 py-2 border border-slate-800 hover:border-red-500/30 hover:text-red-400 rounded-lg text-xs font-semibold transition bg-slate-950/20 text-slate-400">
                <i data-lucide="log-out" class="h-3.5 w-3.5"></i>
                <span>Log Out</span>
            </button>
        </div>
    </aside>

    <!-- 2. RIGHT CONTENT AREA -->
    <div class="flex-grow flex flex-col min-w-0 overflow-hidden">
        <!-- Top bar menu -->
        <header class="bg-white border-b border-slate-200/80 sticky top-0 z-40 px-6 py-3 flex items-center justify-between shadow-sm">
            <!-- Left Header -->
            <div class="flex items-center space-x-4 flex-grow max-w-md">
                <!-- Hamburger on Mobile -->
                <button class="lg:hidden text-slate-500 hover:text-slate-900"><i data-lucide="menu" class="h-5 w-5"></i></button>
                
                <!-- Search bar -->
                <div class="relative w-full hidden md:block" id="global-search-container">
                    <span class="absolute inset-y-0 left-3 flex items-center text-slate-400">
                        <i data-lucide="search" class="h-4 w-4"></i>
                    </span>
                    <input type="text" id="global-search-input" oninput="handleGlobalSearch(this.value)" placeholder="Search leads, contacts, emails..." class="w-full pl-9 pr-12 py-1.5 bg-[#f8fafc] border border-slate-200 rounded-lg text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:border-blue-500" autocomplete="off">
                    <span class="absolute right-3 top-2 px-1 py-0.5 border border-slate-200 bg-white text-[9px] text-slate-400 rounded font-semibold">Ctrl + /</span>
                    
                    <!-- Autocomplete Dropdown -->
                    <div id="global-search-dropdown" class="absolute left-0 right-0 mt-1 bg-white border border-slate-200 rounded-lg shadow-xl hidden max-h-80 overflow-y-auto z-50 text-xs text-slate-800">
                        <div id="global-search-results-list" class="divide-y divide-slate-100"></div>
                    </div>
                </div>
            </div>
            
            <!-- Right Header -->
            <div class="flex items-center space-x-5 text-slate-500">
                <!-- Add icon button -->
                <button class="h-8 w-8 rounded-full border border-slate-200 bg-[#f8fafc] hover:bg-slate-100 flex items-center justify-center text-slate-600 transition">
                    <i data-lucide="plus" class="h-4 w-4"></i>
                </button>

                <!-- Notifications icon -->
                <button class="relative h-8 w-8 flex items-center justify-center hover:text-slate-900 transition">
                    <i data-lucide="bell" class="h-4 w-4 text-slate-600"></i>
                    <span class="absolute -top-1 -right-1 bg-red-500 text-white text-[8px] font-extrabold px-1 py-0.5 rounded-full">3</span>
                </button>

                <!-- Envelope inbox icon -->
                <button class="relative h-8 w-8 flex items-center justify-center hover:text-slate-900 transition">
                    <i data-lucide="mail" class="h-4 w-4 text-slate-600"></i>
                    <span class="absolute -top-1 -right-1 bg-red-500 text-white text-[8px] font-extrabold px-1 py-0.5 rounded-full">12</span>
                </button>

                <!-- Credits Wallet Badge -->
                <a href="#/email-intelligence" id="nav-credit-balance-container" class="flex items-center space-x-1.5 px-3 py-1.5 bg-blue-50 text-blue-600 border border-blue-100 rounded-lg text-[10px] font-extrabold hover:bg-blue-600 hover:text-white transition duration-150">
                    <i data-lucide="zap" class="h-3.5 w-3.5"></i>
                    <span>Credits: <span id="nav-credit-balance-value">...</span></span>
                </a>

                <!-- User profile avatar details -->
                <div class="flex items-center space-x-2 border-l border-slate-200 pl-4">
                    <div class="h-8 w-8 rounded-full bg-emerald-500 text-white font-bold flex items-center justify-center text-xs">
                        AS
                    </div>
                    <div class="hidden sm:block text-left text-[10px]">
                        <div class="font-bold text-slate-800 user-name-display">Admin User</div>
                        <div class="text-slate-400">Super Admin</div>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content Viewport -->
        <main class="flex-grow p-6 md:p-8 overflow-y-auto max-w-7xl w-full mx-auto" id="main-content-viewport">
            <div class="flex items-center justify-center py-20">
                <div class="loader-spinner"></div>
            </div>
        </main>
    </div>

    <!-- Scripts integrations -->
    <script src="assets/js/app.js"></script>
    <script src="assets/js/crm.js"></script>
</body>
</html>
