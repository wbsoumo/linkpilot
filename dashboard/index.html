<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">
<head>
    <script>
        (function() {
            const token = localStorage.getItem('linkpilot_token');
            if (!token) {
                window.location.replace('login.html');
            }
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/img/logo.png">
    <title>CRM Workspace - LinkPilot AI</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Custom Style Sheet -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="h-full bg-slate-950 text-slate-100 flex overflow-hidden">

    <!-- 1. LEFT SIDEBAR PANEL -->
    <aside class="hidden lg:flex flex-col w-64 bg-slate-900/90 border-r border-slate-800/80 p-5 shrink-0 justify-between">
        <div class="space-y-6">
            <!-- Brand Logo -->
            <a href="index.html" class="flex items-center space-x-2 text-lg font-extrabold tracking-wider text-white">
                <span class="text-indigo-400">✨ LinkPilot</span> <span class="text-[9px] px-1.5 py-0.5 bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 rounded font-semibold">CRM v2</span>
            </a>

            <!-- Sidebar Navigation Links -->
            <nav class="space-y-1.5 flex flex-col text-xs" id="sidebar-navigation-container">
                <a href="#/dashboard" class="sidebar-nav-link text-slate-300 hover:bg-slate-800 hover:text-white transition duration-150">
                    <i data-lucide="layout-dashboard" class="h-4 w-4 mr-2.5"></i><span>Dashboard</span>
                </a>
                
                <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest pt-4 pb-1.5 pl-2">CRM Modules</span>
                <a href="#/leads" class="sidebar-nav-link text-slate-300 hover:bg-slate-800 hover:text-white transition duration-150">

                </a>
                <a href="#/companies" class="sidebar-nav-link text-slate-300 hover:bg-slate-800 hover:text-white transition duration-150">

                </a>
                <a href="#/contacts" class="sidebar-nav-link text-slate-300 hover:bg-slate-800 hover:text-white transition duration-150">

                </a>
                <a href="#/deals" class="sidebar-nav-link text-slate-300 hover:bg-slate-800 hover:text-white transition duration-150">
                    <i data-lucide="bar-chart-2" class="h-4 w-4 mr-2.5"></i><span>Deals Pipeline</span>
                </a>

                <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest pt-4 pb-1.5 pl-2">Intelligence</span>
                <a href="#/inbox" class="sidebar-nav-link text-slate-300 hover:bg-slate-800 hover:text-white transition duration-150">
                    <i data-lucide="inbox" class="h-4 w-4 mr-2.5"></i><span>AI Inbox Inbox</span>
                </a>
                <a href="#/email-intelligence" class="sidebar-nav-link text-slate-300 hover:bg-slate-800 hover:text-white transition duration-150">
                    <i data-lucide="cpu" class="h-4 w-4 mr-2.5"></i><span>Email Intelligence</span>
                </a>
                <a href="#/automation" class="sidebar-nav-link text-slate-300 hover:bg-slate-800 hover:text-white transition duration-150">
                    <i data-lucide="workflow" class="h-4 w-4 mr-2.5"></i><span>Automations</span>
                </a>
                
                <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest pt-4 pb-1.5 pl-2">System Control</span>
                <a href="admin.html" id="admin-nav-link" class="sidebar-nav-link text-slate-300 hover:bg-slate-800 hover:text-white transition duration-150 hidden">
                    <i data-lucide="shield-alert" class="h-4 w-4 mr-2.5 text-rose-400"></i><span class="text-rose-400 font-bold">Admin Portal</span>
                </a>

                <div class="truncate max-w-[140px]">

                    <div class="text-[10px] text-slate-500 truncate user-email-display">you@email.com</div>
                </div>

            <button id="logout-action-btn" class="w-full flex items-center justify-center space-x-2 py-2 border border-slate-800 hover:border-red-500/30 hover:text-red-400 rounded-lg text-xs font-semibold transition bg-slate-950/20 text-slate-400">

            <div class="flex items-center space-x-4">
                <!-- Hamburger on Mobile -->
                <button class="lg:hidden text-slate-400 hover:text-white"><i data-lucide="menu" class="h-5 w-5"></i></button>

            <div class="flex items-center space-x-4">

                <a href="#/email-intelligence" id="nav-credit-balance-container" class="flex items-center space-x-1.5 px-3 py-1.5 bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 rounded-lg text-[10px] font-extrabold hover:bg-indigo-600 hover:text-white transition duration-150">

                    <span>Email Credits: <span id="nav-credit-balance-value">...</span></span>

        <!-- Main Content Viewport -->
        <main class="flex-grow p-6 md:p-8 overflow-y-auto max-w-7xl w-full mx-auto" id="main-content-viewport">
            <div class="flex items-center justify-center py-20">
                <div class="loader-spinner"></div>
            </div>
        </main>
    </div>

    <!-- Scripts integrations -->
    <script src="assets/js/app.js"></script>

</html>
