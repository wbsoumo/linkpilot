<!DOCTYPE html>
<html lang="en" class="bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/img/logo.png">
    <title>Log In - LinkPilot AI</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom Style Sheet -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 bg-gradient-to-tr from-slate-950 via-slate-900 to-slate-950">
    <div class="max-w-md w-full space-y-8 animate-fade-in">
        <div class="text-center">
            <h2 class="mt-6 text-3xl font-extrabold text-white tracking-tight">
                Log in to <span class="text-teal-400">LinkPilot AI</span>
            </h2>
            <p class="mt-2 text-sm text-slate-400">
                Unlock automated personalized outreach
            </p>
        </div>

        <div class="glass-panel p-8 shadow-2xl bg-slate-900/60 border border-slate-800 rounded-2xl">
            <form class="space-y-6" id="login-form">
                <div>
                    <label for="email" class="block text-xs font-semibold text-slate-400 uppercase">Email Address</label>
                    <input id="email" name="email" type="email" autocomplete="email" required class="mt-1 block w-full px-3 py-2 bg-slate-800/80 border border-slate-700 rounded-md text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-teal-500 sm:text-sm" placeholder="you@example.com">
                </div>

                <div>
                    <div class="flex justify-between items-center">
                        <label for="password" class="block text-xs font-semibold text-slate-400 uppercase">Password</label>
                        <a href="#" onclick="showNotification('warning', 'Password recovery is under development. Please contact support.'); return false;" class="text-xs font-semibold text-teal-400 hover:underline">Forgot password?</a>
                    </div>
                    <input id="password" name="password" type="password" autocomplete="current-password" required class="mt-1 block w-full px-3 py-2 bg-slate-800/80 border border-slate-700 rounded-md text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-teal-500 sm:text-sm" placeholder="••••••••">
                </div>

                <div class="flex items-center">
                    <input id="remember-me" name="remember-me" type="checkbox" class="h-4 w-4 text-teal-500 focus:ring-teal-400 border-slate-700 bg-slate-800 rounded">
                    <label for="remember-me" class="ml-2 block text-sm text-slate-300">
                        Remember me
                    </label>
                </div>

                <div>
                    <button type="submit" class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-semibold rounded-md text-slate-950 bg-teal-400 hover:bg-teal-300 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-teal-500 transition duration-150 ease-in-out">
                        Log In
                    </button>
                </div>
            </form>

            <div class="mt-6 text-center">
                <span class="text-sm text-slate-400">New to LinkPilot? </span>
                <a href="register.html" class="text-sm font-semibold text-teal-400 hover:underline">Create an account</a>
            </div>
        </div>
    </div>

    <!-- Central JS Handler -->
    <script src="assets/js/app.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            setFormLoading('login-form', true);
            
            const payload = {
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                remember_me: document.getElementById('remember-me').checked
            };
            
            try {
                const data = await apiCall('auth/login.php', 'POST', payload);
                showNotification('success', 'Logged in successfully!');
                
                // Store token & user info
                setAuthToken(data.token);
                localStorage.setItem('linkpilot_user', JSON.stringify(data.user));
                
                // Redirect to Dashboard
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);
            } catch (err) {
                showNotification('error', err.message || 'Login failed. Please verify credentials.');
            } finally {
                setFormLoading('login-form', false);
            }
        });
    </script>
</body>
</html>
