<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/img/logo.png">
    <title>Edit Profile - LinkPilot AI</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Custom Style Sheet -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="h-full bg-slate-950 text-slate-100 flex flex-col">
    <!-- Top Navigation -->
    <nav class="glass-panel rounded-none border-t-0 border-x-0 sticky top-0 z-40 bg-slate-900/80 text-white px-6 py-4 flex items-center justify-between">
        <div class="flex items-center space-x-8">
            <a href="index.html" class="flex items-center space-x-2 text-xl font-bold tracking-wider">
                <span class="text-teal-400">✨ LinkPilot</span> <span class="text-xs px-2 py-0.5 bg-slate-800 text-teal-400 border border-slate-700 rounded-full font-semibold">AI</span>
            </a>
            <div class="hidden md:flex items-center space-x-1">
                <a href="index.html" class="sidebar-nav-link px-4 py-2 rounded-lg text-sm font-semibold transition duration-150">Dashboard</a>
                <a href="history.html" class="sidebar-nav-link px-4 py-2 rounded-lg text-sm font-semibold transition duration-150">History</a>
                <a href="smtp.html" class="sidebar-nav-link px-4 py-2 rounded-lg text-sm font-semibold transition duration-150">SMTP Settings</a>
                <a href="openrouter.html" class="sidebar-nav-link px-4 py-2 rounded-lg text-sm font-semibold transition duration-150">AI Settings</a>
                <a href="profile.html" class="sidebar-nav-link px-4 py-2 rounded-lg text-sm font-semibold transition duration-150">Profile</a>
                <a href="admin.html" id="admin-nav-link" class="sidebar-nav-link px-4 py-2 rounded-lg text-sm font-semibold transition duration-150 hidden">Admin</a>
            </div>
        </div>
        <div class="flex items-center space-x-4">
            <div class="text-right hidden sm:block">
                <div class="text-sm font-semibold user-name-display">Loading...</div>
                <div class="text-xs text-slate-400 user-email-display">...</div>
            </div>
            <div class="h-9 w-9 rounded-full bg-teal-500 text-slate-950 font-bold flex items-center justify-center border border-teal-400" id="user-avatar-initials">
                LP
            </div>
            <button id="logout-action-btn" class="p-2 text-slate-400 hover:text-red-400 rounded-lg hover:bg-slate-800/50 transition">
                <i data-lucide="log-out" class="h-5 w-5"></i>
            </button>
        </div>
    </nav>

    <!-- Main Content Container -->
    <main class="flex-grow p-6 md:p-8 flex items-center justify-center bg-gradient-to-tr from-slate-950 via-slate-900 to-slate-950">
        <div class="max-w-2xl w-full animate-fade-in space-y-6">
            <div class="text-center md:text-left">
                <h1 class="text-2xl font-extrabold text-white">Edit Your Profile</h1>
                <p class="text-sm text-slate-400 mt-1">Keep your professional bio up-to-date. This info is fed directly into the AI to write highly-targeted outreach emails.</p>
            </div>
            
            <div class="glass-panel p-8 bg-slate-900/60 border border-slate-800 rounded-2xl shadow-2xl">
                <form id="profile-form" class="space-y-6">
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label for="name" class="block text-xs font-semibold text-slate-400 uppercase">Full Name *</label>
                            <input id="name" name="name" type="text" required class="mt-1 block w-full px-3 py-2 bg-slate-800/80 border border-slate-700 rounded-md text-white focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-teal-500 sm:text-sm">
                        </div>
                        <div>
                            <label for="user_type" class="block text-xs font-semibold text-slate-400 uppercase">User Type *</label>
                            <select id="user_type" name="user_type" required class="mt-1 block w-full px-3 py-2 bg-slate-800/80 border border-slate-700 rounded-md text-white focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-teal-500 sm:text-sm">
                                <option value="Job Seeker">Job Seeker</option>
                                <option value="Freelancer">Freelancer</option>
                                <option value="Agency">Agency</option>
                                <option value="Recruiter">Recruiter</option>
                                <option value="Business Owner">Business Owner</option>
                                <option value="Sales Professional">Sales Professional</option>
                            </select>
                        </div>
                        <div>
                            <label for="job_title" class="block text-xs font-semibold text-slate-400 uppercase">Current Job Title</label>
                            <input id="job_title" name="job_title" type="text" class="mt-1 block w-full px-3 py-2 bg-slate-800/80 border border-slate-700 rounded-md text-white focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-teal-500 sm:text-sm">
                        </div>
                        <div>
                            <label for="experience_years" class="block text-xs font-semibold text-slate-400 uppercase">Years of Experience</label>
                            <input id="experience_years" name="experience_years" type="number" min="0" class="mt-1 block w-full px-3 py-2 bg-slate-800/80 border border-slate-700 rounded-md text-white focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-teal-500 sm:text-sm">
                        </div>
                        <div class="md:col-span-2">
                            <label for="company_name" class="block text-xs font-semibold text-slate-400 uppercase">Company Name</label>
                            <input id="company_name" name="company_name" type="text" class="mt-1 block w-full px-3 py-2 bg-slate-800/80 border border-slate-700 rounded-md text-white focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-teal-500 sm:text-sm">
                        </div>
                        <div class="md:col-span-2">
                            <label for="skills" class="block text-xs font-semibold text-slate-400 uppercase">Skills (Comma Separated)</label>
                            <input id="skills" name="skills" type="text" class="mt-1 block w-full px-3 py-2 bg-slate-800/80 border border-slate-700 rounded-md text-white focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-teal-500 sm:text-sm">
                        </div>
                        <div>
                            <label for="website" class="block text-xs font-semibold text-slate-400 uppercase">Website URL</label>
                            <input id="website" name="website" type="url" class="mt-1 block w-full px-3 py-2 bg-slate-800/80 border border-slate-700 rounded-md text-white focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-teal-500 sm:text-sm">
                        </div>
                        <div>
                            <label for="portfolio_url" class="block text-xs font-semibold text-slate-400 uppercase">Portfolio URL</label>
                            <input id="portfolio_url" name="portfolio_url" type="url" class="mt-1 block w-full px-3 py-2 bg-slate-800/80 border border-slate-700 rounded-md text-white focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-teal-500 sm:text-sm">
                        </div>
                        <div class="md:col-span-2">
                            <label for="linkedin_url" class="block text-xs font-semibold text-slate-400 uppercase">LinkedIn Profile URL</label>
                            <input id="linkedin_url" name="linkedin_url" type="url" class="mt-1 block w-full px-3 py-2 bg-slate-800/80 border border-slate-700 rounded-md text-white focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-teal-500 sm:text-sm">
                        </div>
                        <div class="md:col-span-2">
                            <label for="about_me" class="block text-xs font-semibold text-slate-400 uppercase">About Yourself</label>
                            <textarea id="about_me" name="about_me" rows="3" class="mt-1 block w-full px-3 py-2 bg-slate-800/80 border border-slate-700 rounded-md text-white focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-teal-500 sm:text-sm"></textarea>
                        </div>
                    </div>

                    <div>
                        <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent text-sm font-semibold rounded-md text-slate-950 bg-teal-400 hover:bg-teal-300 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-teal-500 transition duration-150 ease-in-out">
                            Save Profile Details
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- Central JS Handler -->
    <script src="assets/js/app.js"></script>
    <script>
        async function loadProfile() {
            try {
                const res = await apiCall('profile/get.php');
                
                document.getElementById('name').value = res.user.name || '';
                
                if (res.profile) {
                    document.getElementById('user_type').value = res.profile.user_type || 'Job Seeker';
                    document.getElementById('job_title').value = res.profile.job_title || '';
                    document.getElementById('experience_years').value = res.profile.experience_years || 0;
                    document.getElementById('company_name').value = res.profile.company_name || '';
                    document.getElementById('skills').value = res.profile.skills || '';
                    document.getElementById('website').value = res.profile.website || '';
                    document.getElementById('portfolio_url').value = res.profile.portfolio_url || '';
                    document.getElementById('linkedin_url').value = res.profile.linkedin_url || '';
                    document.getElementById('about_me').value = res.profile.about_me || '';
                }
            } catch (err) {
                showNotification('error', err.message || 'Failed to load profile details.');
            }
        }

        document.getElementById('profile-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            setFormLoading('profile-form', true);
            
            const payload = {
                name: document.getElementById('name').value,
                user_type: document.getElementById('user_type').value,
                job_title: document.getElementById('job_title').value,
                experience_years: parseInt(document.getElementById('experience_years').value),
                company_name: document.getElementById('company_name').value,
                skills: document.getElementById('skills').value,
                website: document.getElementById('website').value,
                portfolio_url: document.getElementById('portfolio_url').value,
                linkedin_url: document.getElementById('linkedin_url').value,
                about_me: document.getElementById('about_me').value
            };

            try {
                await apiCall('profile/update.php', 'POST', payload);
                showNotification('success', 'Profile updated successfully!');
                
                // Update cached user object name
                const user = getCurrentUser();
                user.name = payload.name;
                localStorage.setItem('linkpilot_user', JSON.stringify(user));
                
                // Refresh top navigation values
                setupNavigation();
            } catch (err) {
                showNotification('error', err.message || 'Failed to save profile changes.');
            } finally {
                setFormLoading('profile-form', false);
            }
        });

        // Initialize Profile page
        document.addEventListener('DOMContentLoaded', () => {
            loadProfile();
            lucide.createIcons();
        });
    </script>
</body>
</html>
