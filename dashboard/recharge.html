<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirecting to Recharge...</title>
    <script>
        (function() {
            const params = new URLSearchParams(window.location.search);
            const status = params.get('status');
            let dest = 'index.html#/recharge';
            if (status) {
                dest += '?status=' + encodeURIComponent(status);
            }
            window.location.replace(dest);
        })();
    </script>
</head>
<body>
    <p style="font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif; text-align:center; margin-top:20vh; color:#64748b;">
        Redirecting to the new recharge portal...
    </p>
</body>
</html>
