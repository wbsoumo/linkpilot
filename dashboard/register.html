<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - LinkPilot AI</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom Style Sheet -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="h-full flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 bg-gradient-to-tr from-slate-950 via-slate-900 to-slate-950">
    <div class="max-w-2xl w-full space-y-8 animate-fade-in">
        <div class="text-center">
            <h2 class="mt-6 text-3xl font-extrabold text-white tracking-tight">
                Create your <span class="text-teal-400">LinkPilot AI</span> Account
            </h2>
            <p class="mt-2 text-sm text-slate-400">
                Generate highly personalized outreach messages in seconds
            </p>
        </div>

        <div class="glass-panel p-8 shadow-2xl bg-slate-900/60 border border-slate-800 rounded-2xl">
            <form class="space-y-6" id="register-form">
                
                <!-- Section: Account Information -->
                <div class="border-b border-slate-800 pb-4">
                    <h3 class="text-lg font-medium text-white mb-4">Account Details</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label for="name" class="block text-xs font-semibold text-slate-400 uppercase">Full Name *</label>
                            <input id="name" name="name" type="text" required class="mt-1 block w-full px-3 py-2 bg-slate-800/80 border border-slate-700 rounded-md text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-teal-500 sm:text-sm" placeholder="John Doe">
                        </div>
                        <div>
                            <label for="email" class="block text-xs font-semibold text-slate-400 uppercase">Email Address *</label>
                            <input id="email" name="email" type="email" required class="mt-1 block w-full px-3 py-2 bg-slate-800/80 border border-slate-700 rounded-md text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-teal-500 sm:text-sm" placeholder="john@example.com">
                        </div>
                        <div>
                            <label for="password" class="block text-xs font-semibold text-slate-400 uppercase">Password *</label>
                            <input id="password" name="password" type="password" required class="mt-1 block w-full px-3 py-2 bg-slate-800/80 border border-slate-700 rounded-md text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-teal-500 sm:text-sm" placeholder="••••••••">
                        </div>
                        <div>
                            <label for="confirm_password" class="block text-xs font-semibold text-slate-400 uppercase">Confirm Password *</label>
                            <input id="confirm_password" name="confirm_password" type="password" required class="mt-1 block w-full px-3 py-2 bg-slate-800/80 border border-slate-700 rounded-md text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-teal-500 sm:text-sm" placeholder="••••••••">
                        </div>
                    </div>
                </div>

                <!-- Section: Profile Information -->
                <div>
                    <h3 class="text-lg font-medium text-white mb-4">Professional Profile</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label for="user_type" class="block text-xs font-semibold text-slate-400 uppercase">User Type *</label>
                            <select id="user_type" name="user_type" required class="mt-1 block w-full px-3 py-2 bg-slate-800/80 border border-slate-700 rounded-md text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-teal-500 sm:text-sm">
                                <option value="" class="bg-slate-900 text-slate-400">Select User Type</option>
                                <option value="Job Seeker" class="bg-slate-900">Job Seeker</option>
                                <option value="Freelancer" class="bg-slate-900">Freelancer</option>
                                <option value="Agency" class="bg-slate-900">Agency</option>
                                <option value="Recruiter" class="bg-slate-900">Recruiter</option>
                                <option value="Business Owner" class="bg-slate-900">Business Owner</option>
                                <option value="Sales Professional" class="bg-slate-900">Sales Professional</option>
                            </select>
                        </div>
                        <div>
                            <label for="job_title" class="block text-xs font-semibold text-slate-400 uppercase">Current Job Title</label>
                            <input id="job_title" name="job_title" type="text" class="mt-1 block w-full px-3 py-2 bg-slate-800/80 border border-slate-700 rounded-md text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-teal-500 sm:text-sm" placeholder="Software Engineer">
                        </div>
                        <div>
                            <label for="experience_years" class="block text-xs font-semibold text-slate-400 uppercase">Years of Experience</label>
                            <input id="experience_years" name="experience_years" type="number" min="0" class="mt-1 block w-full px-3 py-2 bg-slate-800/80 border border-slate-700 rounded-md text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-teal-500 sm:text-sm" placeholder="3">
                        </div>
                        <div>
                            <label for="company_name" class="block text-xs font-semibold text-slate-400 uppercase">Company Name</label>
                            <input id="company_name" name="company_name" type="text" class="mt-1 block w-full px-3 py-2 bg-slate-800/80 border border-slate-700 rounded-md text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-teal-500 sm:text-sm" placeholder="Acme Corp">
                        </div>
                        <div class="md:col-span-2">
                            <label for="skills" class="block text-xs font-semibold text-slate-400 uppercase">Skills (Comma Separated)</label>
                            <input id="skills" name="skills" type="text" class="mt-1 block w-full px-3 py-2 bg-slate-800/80 border border-slate-700 rounded-md text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-teal-500 sm:text-sm" placeholder="PHP, JavaScript, React, System Design">
                        </div>
                        <div>
                            <label for="website" class="block text-xs font-semibold text-slate-400 uppercase">Website URL</label>
                            <input id="website" name="website" type="url" class="mt-1 block w-full px-3 py-2 bg-slate-800/80 border border-slate-700 rounded-md text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-teal-500 sm:text-sm" placeholder="https://example.com">
                        </div>
                        <div>
                            <label for="portfolio_url" class="block text-xs font-semibold text-slate-400 uppercase">Portfolio URL</label>
                            <input id="portfolio_url" name="portfolio_url" type="url" class="mt-1 block w-full px-3 py-2 bg-slate-800/80 border border-slate-700 rounded-md text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-teal-500 sm:text-sm" placeholder="https://portfolio.com">
                        </div>
                        <div class="md:col-span-2">
                            <label for="linkedin_url" class="block text-xs font-semibold text-slate-400 uppercase">LinkedIn Profile URL</label>
                            <input id="linkedin_url" name="linkedin_url" type="url" class="mt-1 block w-full px-3 py-2 bg-slate-800/80 border border-slate-700 rounded-md text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-teal-500 sm:text-sm" placeholder="https://linkedin.com/in/username">
                        </div>
                        <div class="md:col-span-2">
                            <label for="about_me" class="block text-xs font-semibold text-slate-400 uppercase">About Yourself</label>
                            <textarea id="about_me" name="about_me" rows="3" class="mt-1 block w-full px-3 py-2 bg-slate-800/80 border border-slate-700 rounded-md text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-teal-500 sm:text-sm" placeholder="Tell us about your professional background..."></textarea>
                        </div>
                    </div>
                </div>

                <div>
                    <button type="submit" class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-semibold rounded-md text-slate-950 bg-teal-400 hover:bg-teal-300 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-teal-500 transition duration-150 ease-in-out">
                        Register Account
                    </button>
                </div>
            </form>

            <div class="mt-6 text-center">
                <span class="text-sm text-slate-400">Already have an account? </span>
                <a href="login.html" class="text-sm font-semibold text-teal-400 hover:underline">Log in here</a>
            </div>
        </div>
    </div>

    <!-- Central JS Handler -->
    <script src="assets/js/app.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm_password').value;
            
            if (password !== confirmPassword) {
                showNotification('error', 'Passwords do not match.');
                return;
            }
            
            setFormLoading('register-form', true);
            
            const payload = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                password: password,
                confirm_password: confirmPassword,
                user_type: document.getElementById('user_type').value,
                job_title: document.getElementById('job_title').value,
                experience_years: document.getElementById('experience_years').value,
                skills: document.getElementById('skills').value,
                company_name: document.getElementById('company_name').value,
                website: document.getElementById('website').value,
                portfolio_url: document.getElementById('portfolio_url').value,
                linkedin_url: document.getElementById('linkedin_url').value,
                about_me: document.getElementById('about_me').value
            };
            
            try {
                const data = await apiCall('auth/register.php', 'POST', payload);
                showNotification('success', 'Registration successful!');
                
                // Store token & user info
                setAuthToken(data.token);
                localStorage.setItem('linkpilot_user', JSON.stringify(data.user));
                
                // Redirect to SMTP Configuration Setup
                setTimeout(() => {
                    window.location.href = 'smtp.html';
                }, 1500);
            } catch (err) {
                showNotification('error', err.message || 'Registration failed. Please try again.');
            } finally {
                setFormLoading('register-form', false);
            }
        });
    </script>
</body>
</html>
