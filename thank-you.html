<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="dashboard/assets/img/logo.png">
    
    <title>Thank You - LinkPilot AI</title>
    <meta name="description" content="Thank you for getting in touch with LinkPilot AI.">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="assets/css/marketing.css">
</head>
<body class="h-full bg-slate-950 text-slate-100 flex flex-col justify-between antialiased">

    <!-- Navigation -->
    <nav class="glass-nav w-full px-6 py-4 flex items-center justify-between">
        <a href="index.html" class="flex items-center space-x-2 text-xl font-bold tracking-wider">
            <span class="text-teal-400">✨ LinkPilot</span>
            <span class="text-xs px-2 py-0.5 bg-slate-800 text-teal-400 border border-slate-700 rounded-full font-semibold">AI</span>
        </a>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center p-6 text-center glow-accent">
        <div class="space-y-6 max-w-md glass-panel p-8 rounded-2xl border-slate-800 shadow-2xl">
            <div class="w-12 h-12 mx-auto rounded-full bg-teal-500/10 text-teal-400 flex items-center justify-center">
                <i data-lucide="check-circle" class="h-6 w-6"></i>
            </div>
            <h1 class="text-2xl font-extrabold text-white">Thank You!</h1>
            <p class="text-xs text-slate-400 leading-relaxed">
                Your request has been successfully recorded. If you submitted a support ticket, our team will review the details and respond shortly.
            </p>
            <div class="flex flex-col sm:flex-row space-y-2 sm:space-y-0 sm:space-x-3 justify-center pt-2">
                <a href="index.html" class="px-5 py-2.5 bg-slate-900 border border-slate-850 hover:border-slate-700 text-slate-300 font-semibold rounded-lg text-xs transition">Return Home</a>
                <a href="dashboard/index.html" class="px-5 py-2.5 bg-teal-400 hover:bg-teal-300 text-slate-950 font-bold rounded-lg text-xs transition shadow shadow-teal-500/25">Go to Dashboard</a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-900 bg-slate-950 py-8 text-slate-500 text-xs text-center">
        <div>© 2026 LinkPilot AI. All rights reserved.</div>
    </footer>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
